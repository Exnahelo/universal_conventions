# Merge these sections into an existing pyproject.toml; do not replace project metadata.
[tool.ruff]
line-length = 100
extend-exclude = ["**/originals/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
